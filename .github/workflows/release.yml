name: Build and verify analytics release
on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: Corvus
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tordo-io/tordo-sdk
          ref: 8cd3fe09ac9f70b6f93f4a481f1f5351b35c7adc
          path: Tordo.SDK
          token: ${{ secrets.SDK_READ_TOKEN }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy
      - name: API checks with the published SDK source
        working-directory: Corvus
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: Corvus/apps/ui/package-lock.json
      - name: UI checks
        working-directory: Corvus/apps/ui
        run: |
          npm ci
          npm test -- --watch=false
          npm run build -- --base-href /corvus/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Corvus/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/htm4rck/corvus:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/htm4rck/Corvus
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=corvus
          cache-to: type=gha,mode=max,scope=corvus
  deploy-dev:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == 'develop'
    runs-on: ubuntu-24.04
    steps:
      - name: Activate only this DEV service
        env:
          PLATFORM_DEPLOY_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
        run: |
          node - <<'NODE'
          const token=process.env.PLATFORM_DEPLOY_TOKEN;
          if(!token)throw Error('Missing PLATFORM_DEPLOY_TOKEN');
          const body={ref:'develop',inputs:{source_repo:process.env.GITHUB_REPOSITORY,source_sha:process.env.GITHUB_SHA}};
          fetch('https://api.github.com/repos/htm4rck/Tordo.Platform/actions/workflows/deploy-dev.yml/dispatches',{method:'POST',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)}).then(response=>{if(!response.ok)throw Error('DEV dispatch failed: '+response.status);}).catch(error=>{console.error(error.message);process.exitCode=1});
          NODE
