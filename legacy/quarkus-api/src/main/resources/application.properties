quarkus.application.name=corvus
quarkus.http.port=${HTTP_PORT:8086}
quarkus.http.root-path=/

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/tordo?currentSchema=corvus}
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:yourpassword}
quarkus.datasource.jdbc.max-size=16

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=corvus
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.validate-in-dev-mode=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=corvus
quarkus.flyway.create-schemas=true

quarkus.smallrye-health.root-path=/health
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.smallrye-openapi.path=/openapi

quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%X{correlationId}] [%c{2.}] (%t) %s%e%n
