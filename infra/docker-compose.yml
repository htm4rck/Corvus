name: tordo-analytics-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: tordo-analytics-dev-postgres
    restart: unless-stopped
    env_file: ../.runtime/postgres.env
    ports: ["127.0.0.1:55436:5432"]
    volumes: ["analytics-dev-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  analytics-dev-data:
